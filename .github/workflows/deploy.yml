name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, publish Pages, and prove who we are to it.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancel it — a half-published site is worse than
# a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static export
        env:
          # Pages serves the repo at /Portfolio-story-2026/, so every asset needs
          # that prefix. Cloudflare and `next dev` serve at the root and set
          # nothing, which is why this lives here and not in next.config.ts.
          NEXT_PUBLIC_BASE_PATH: /Portfolio-story-2026
        run: npm run build

      - name: Stop Pages running Jekyll on the output
        # Without this, Pages hides every directory starting with an underscore —
        # which is all of Next's /_next bundle. The site would load as bare HTML.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
